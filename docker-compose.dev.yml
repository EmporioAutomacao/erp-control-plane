services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp_cp
      POSTGRES_USER: erp_cp
      POSTGRES_PASSWORD: erp_cp_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - tenants:/opt/tenants
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TENANTS_BASE_PATH: /opt/tenants
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - tenants:/opt/tenants
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TENANTS_BASE_PATH: /opt/tenants
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  tenants:
