<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Conexão com o Arpa</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; padding: 16px; }
    .card { max-width: 480px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; color: #f8fafc; }
    p { margin: 0 0 10px; line-height: 1.5; }
    .dica { color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Não foi possível concluir a conexão com o Arpa</h1>
    <p>{{ mensagem }}</p>
    <p class="dica">Volte ao ERP e clique em "Conectar ao Arpa" novamente. Se o problema continuar, fale com o suporte da Arara Suite.</p>
  </div>
</body>
</html>
