version: "3.8"

# stack-prod.yml — stack Docker Swarm do Control Plane em produção
#
# Deploy:
#   export $(cat /opt/cp/.env | xargs) && docker stack deploy --with-registry-auth -c stack-prod.yml ararasuite-cp
#
# Pré-requisitos no servidor:
#   - Docker Swarm inicializado (docker swarm init)
#   - Rede externa "traefik-public" criada (compartilhada com o stack do Traefik)
#   - Arquivo /opt/cp/.env preenchido (ver .env.example)
#   - Credenciais DockerHub em /root/.docker/config.json (docker login)
#
# Serviços:
#   web     — Django + Gunicorn, exposto ao Traefik
#   celery  — worker assíncrono (provisionamento, e-mails, saúde dos clientes)
#   beat    — agendador de tarefas periódicas (usa banco de dados via django-celery-beat)
#   db      — PostgreSQL exclusivo do CP
#   redis   — broker do Celery e backend de resultados

services:

  # ─── Web (Django + Gunicorn) ──────────────────────────────────────────────
  # Exposto via Traefik na rede traefik-public. Todo o tráfego entra pela
  # porta 80 do Traefik (entrypoint=web); HTTPS é terminado pelo Cloudflare,
  # que encaminha HTTP para o servidor.
  web:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint.sh"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"                              # chave Django para sessões e CSRF
      DEBUG: "false"
      ALLOWED_HOSTS: "${CP_DOMAIN}"
      CSRF_TRUSTED_ORIGINS: "https://${CP_DOMAIN}"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CLIENTES_BASE_PATH: "/opt/clientes"                     # diretório base dos stacks dos clientes
      CP_BACKUP_DIR: "${CP_BACKUP_DIR:-/opt/backups/cp}"      # destino dos backups do CP
      CP_BACKUP_MANTER: "${CP_BACKUP_MANTER:-7}"              # quantos backups reter
      ERP_DOMAIN: "${CP_DOMAIN}"                              # domínio base dos subdomínios dos clientes
      SAAS_DOMAIN: "${CP_DOMAIN}"                             # usado na landing para preview do subdomínio
      ERP_LATEST_VERSION: "${ERP_LATEST_VERSION:-latest}"     # versão do ERP usada em novos provisionamentos
      PROVISIONING_CHECK_HTTP: "true"                         # aguarda HTTP /health/ após deploy do cliente
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD}"
      CF_API_TOKEN: "${CF_API_TOKEN}"                         # token Cloudflare (Zone:Read + DNS:Edit em All Zones)
      SERVER_IP: "${SERVER_IP}"                               # IP público do servidor Swarm manager
    volumes:
      # Socket Docker — permite que o CP gerencie stacks dos clientes via API Docker
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # Credenciais DockerHub — necessárias para puxar a imagem privada do ERP nos nós do Swarm
      - type: bind
        source: /root/.docker
        target: /root/.docker
        read_only: true
      # Diretório dos stacks dos clientes (arquivos .env e stack.yml de cada tenant)
      - type: bind
        source: /opt/clientes
        target: /opt/clientes
      # Diretório de backups do CP
      - type: bind
        source: /opt/backups/cp
        target: /opt/backups/cp
    networks:
      - traefik-public    # rede compartilhada com o Traefik para roteamento HTTP
      - cp-internal       # rede interna entre os serviços do CP
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager    # deve rodar no manager para acessar o Docker socket
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ararasuite-cp.rule=Host(`${CP_DOMAIN}`)"
        - "traefik.http.routers.ararasuite-cp.entrypoints=web"
        - "traefik.http.services.ararasuite-cp.loadbalancer.server.port=8000"

  # ─── Celery Worker ────────────────────────────────────────────────────────
  # Processa tasks assíncronas: provisionamento de clientes, envio de e-mails,
  # health checks, backups, atualizações de versão.
  # Também precisa do socket Docker e do diretório de clientes.
  celery:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint-worker.sh", "celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "false"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CLIENTES_BASE_PATH: "/opt/clientes"
      CP_BACKUP_DIR: "${CP_BACKUP_DIR:-/opt/backups/cp}"
      CP_BACKUP_MANTER: "${CP_BACKUP_MANTER:-7}"
      ERP_DOMAIN: "${CP_DOMAIN}"
      ERP_LATEST_VERSION: "${ERP_LATEST_VERSION:-latest}"
      PROVISIONING_CHECK_HTTP: "true"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /root/.docker
        target: /root/.docker
        read_only: true
      - type: bind
        source: /opt/clientes
        target: /opt/clientes
      - type: bind
        source: /opt/backups/cp
        target: /opt/backups/cp
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ─── Celery Beat ──────────────────────────────────────────────────────────
  # Agendador de tarefas periódicas. Lê os agendamentos do banco de dados
  # (django-celery-beat) e enfileira tasks no Redis conforme os intervalos/crontabs
  # configurados no admin. Apenas um beat deve rodar — nunca escalar para > 1.
  beat:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint-worker.sh", "celery", "-A", "core", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "false"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - cp-internal
    deploy:
      replicas: 1    # NUNCA aumentar — múltiplas instâncias disparam tasks duplicadas
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  # Banco exclusivo do Control Plane. Dados dos clientes (stacks do ERP) ficam
  # em bancos separados dentro de cada stack provisionado — não aqui.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ─── Redis ────────────────────────────────────────────────────────────────
  # Broker de mensagens do Celery e backend de resultados das tasks.
  redis:
    image: redis:7-alpine
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  pgdata:    # dados persistentes do PostgreSQL do Control Plane

networks:
  # Rede compartilhada com o Traefik — deve existir antes do deploy
  # Criar com: docker network create --driver overlay --attachable traefik-public
  traefik-public:
    external: true
  # Rede interna isolada entre os serviços do CP (web, celery, beat, db, redis)
  cp-internal:
    driver: overlay
    attachable: false
