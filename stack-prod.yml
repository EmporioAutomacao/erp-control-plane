version: "3.8"

# Deploy: export $(cat /opt/cp/.env | xargs) && docker stack deploy --with-registry-auth -c stack-prod.yml ararasuite-cp

services:

  web:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint.sh"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "false"
      ALLOWED_HOSTS: "${CP_DOMAIN}"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CLIENTES_BASE_PATH: "/opt/clientes"
      ERP_DOMAIN: "${CP_DOMAIN}"
      SAAS_DOMAIN: "${CP_DOMAIN}"
      ERP_LATEST_VERSION: "${ERP_LATEST_VERSION:-latest}"
      PROVISIONING_CHECK_HTTP: "true"
      EMAIL_HOST: "${EMAIL_HOST}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /opt/clientes
        target: /opt/clientes
    networks:
      - traefik-public
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ararasuite-cp.rule=Host(`${CP_DOMAIN}`)"
        - "traefik.http.routers.ararasuite-cp.entrypoints=websecure"
        - "traefik.http.routers.ararasuite-cp.tls.certresolver=le"
        - "traefik.http.services.ararasuite-cp.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.ararasuite-cp-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.ararasuite-cp-http.rule=Host(`${CP_DOMAIN}`)"
        - "traefik.http.routers.ararasuite-cp-http.entrypoints=web"
        - "traefik.http.routers.ararasuite-cp-http.middlewares=ararasuite-cp-redirect"

  celery:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint-worker.sh", "celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "false"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CLIENTES_BASE_PATH: "/opt/clientes"
      ERP_DOMAIN: "${CP_DOMAIN}"
      ERP_LATEST_VERSION: "${ERP_LATEST_VERSION:-latest}"
      PROVISIONING_CHECK_HTTP: "true"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /opt/clientes
        target: /opt/clientes
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  beat:
    image: emporioautomacao/ararasuite-cp:${CP_VERSION:-latest}
    command: ["./entrypoint-worker.sh", "celery", "-A", "core", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "false"
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-erp_cp}"
      POSTGRES_USER: "${POSTGRES_USER:-erp_cp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks:
      - cp-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  pgdata:

networks:
  traefik-public:
    external: true
  cp-internal:
    driver: overlay
    attachable: false
