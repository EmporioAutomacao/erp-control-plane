# stack-rustfs.yml — RustFS (armazenamento S3 dos backups do CP) para o Portainer / Docker Swarm
#
# Cole em Portainer > Stacks > Add stack (nome sugerido: "rustfs") e defina as variáveis abaixo na
# tela do stack. Ele também cria a rede overlay "storage-net", usada só num atalho interno OPCIONAL
# (o CP não depende dela: por padrão acessa o RustFS pelo domínio público).
#
# Pré-requisitos:
#   - Rede externa "traefik-public" (a mesma do Traefik e do CP).
#   - Cloudflare: registros DNS (proxied) de S3_DOMAIN e CONSOLE_DOMAIN, como os demais subdomínios.
#     O TLS termina no Cloudflare; o Traefik recebe no entrypoint "web" (sem certresolver).
#
# Variáveis do stack:
#   RUSTFS_ACCESS_KEY   obrigatória  usuário root do RustFS (mín. 8 caracteres; não use "rustfsadmin")
#   RUSTFS_SECRET_KEY   obrigatória  senha root (mín. 8 caracteres)
#   S3_DOMAIN           opcional     padrão s3.ararasuite.com.br       (API S3 — links de download)
#   CONSOLE_DOMAIN      opcional     padrão rustfs.ararasuite.com.br   (console web)
#   RUSTFS_VERSION      opcional     tag da imagem (padrão: latest — prefira fixar uma versão)
#
# Como o CP usa este serviço:
#   Cadastre a conexão em Admin > Configurações > Armazenamento:
#   - Endpoint de acesso e endpoint público:        https://<S3_DOMAIN>
#   Atalho interno opcional (evita o Cloudflare, que limita o corpo das requisições): anexe a rede
#   "storage-net" a web/celery/agente-no no stack do CP e use http://rustfs-s3:9000 como endpoint de acesso.
#   Depois do deploy: entre no console, crie o bucket "cp-backups" e uma access key dedicada para o CP
#   (não use a conta root na tela de Armazenamento). A tela mostra o status da conexão.

version: "3.8"

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}

    volumes:
      # Volume local do nó (a imagem roda como uid 10001, dono de /data — não precisa de chown).
      - rustfs_data:/data

    networks:
      traefik-public: {}          # roteamento HTTP pelo Traefik (navegador)
      storage-net:                # acesso interno do CP (upload/restauração dos nós)
        aliases:
          - rustfs-s3

    environment:
      TZ: America/Sao_Paulo
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?defina RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?defina RUSTFS_SECRET_KEY}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          # O volume é local: o serviço precisa ficar sempre neste nó.
          - node.hostname == servidorubuntuanptruenas

      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 120s

      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public

        # API S3
        - traefik.http.routers.rustfs-s3.rule=Host(`${S3_DOMAIN:-s3.ararasuite.com.br}`)
        - traefik.http.routers.rustfs-s3.entrypoints=web
        - traefik.http.routers.rustfs-s3.service=rustfs-s3
        - traefik.http.services.rustfs-s3.loadbalancer.server.port=9000

        # Console web
        - traefik.http.routers.rustfs-console.rule=Host(`${CONSOLE_DOMAIN:-rustfs.ararasuite.com.br}`)
        - traefik.http.routers.rustfs-console.entrypoints=web
        - traefik.http.routers.rustfs-console.service=rustfs-console
        - traefik.http.services.rustfs-console.loadbalancer.server.port=9001

volumes:
  rustfs_data:
    name: rustfs_data

networks:
  # Rede interna do S3: criada aqui e referenciada como externa pelo stack-prod.yml do CP.
  storage-net:
    name: storage-net
    driver: overlay
    attachable: true

  traefik-public:
    external: true
